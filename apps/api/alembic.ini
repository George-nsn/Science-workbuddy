[alembic]
script_location = alembic
prepend_sys_path = src
# Placeholder only: alembic/env.py always overrides this with the configured
# DATABASE_URL (SQLite in local development, see config.py). Keeping the
# default consistent with the documented local setup avoids misleading readers.
sqlalchemy.url = sqlite+aiosqlite:///data/science_buddy.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
